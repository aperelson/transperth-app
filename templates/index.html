<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>When's The Bus?</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    body { padding: 1.5rem; }
    .card { margin-bottom: 1rem; }
    .stop-name a { color: #006639; text-decoration: none; font-weight: 600; }
    .stop-name a:hover { text-decoration: underline; }
    @media (prefers-color-scheme: dark) {
      body { background-color: #121212; color: #fff; }
      .card { background-color: #1e1e1e; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="mb-4"><i class="bi bi-bus-front-fill me-2"></i>When's The Bus?</h1>
    <div id="status" class="text-muted mb-3">Getting your location...</div>
    <div id="stops"></div>
  </div>

  <script>
    async function loadNearbyStops(lat, lon) {
      const res = await fetch(`/nearby?lat=${lat}&lon=${lon}`);
      const data = await res.json();

      const container = document.getElementById('stops');
      container.innerHTML = '';

      if (!data.nearbyStops || data.nearbyStops.length === 0) {
        container.innerHTML = '<p class="text-muted">No nearby stops found.</p>';
        return;
      }

      data.nearbyStops.forEach(stop => {
        const card = document.createElement('div');
        card.className = 'card shadow-sm';
        card.innerHTML = `
          <div class="card-body">
            <h5 class="stop-name">
              <a href="https://maps.google.com/?q=${stop.Latitude},${stop.Longitude}" target="_blank">
                ${stop.StopName}
              </a>
            </h5>
            <p class="mb-1">Stop ${stop.StopNumber} — ${stop.Distance} m away</p>
            <ul class="list-group list-group-flush" id="trips-${stop.StopNumber}">
              <li class="list-group-item text-muted">Loading bus times...</li>
            </ul>
          </div>
        `;
        container.appendChild(card);

        // Load next buses for this stop
        fetch(`/nextbuses?stop=${stop.StopNumber}`)
          .then(r => r.json())
          .then(trips => {
            const ul = document.getElementById(`trips-${stop.StopNumber}`);
            ul.innerHTML = '';
            if (!trips || trips.length === 0) {
              ul.innerHTML = '<li class="list-group-item text-muted">No upcoming departures</li>';
              return;
            }
            trips.slice(0,3).forEach(trip => {
              ul.innerHTML += `
                <li class="list-group-item d-flex justify-content-between align-items-center">
                  <div><strong>${trip.DisplayRouteCode}</strong> → ${trip.DisplayTripTitle}</div>
                  <div>${trip.EstimatedArrivalTime || trip.ArriveTime || 'N/A'}</div>
                </li>`;
            });
          });
      });
    }

    function init() {
      if (!navigator.geolocation) {
        document.getElementById('status').innerText = "Geolocation not supported.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        pos => {
          document.getElementById('status').innerText = "Fetching nearby stops...";
          loadNearbyStops(pos.coords.latitude, pos.coords.longitude);
        },
        err => {
          document.getElementById('status').innerText = "Unable to get location.";
        }
      );
    }

    init();
  </script>
</body>
</html>
